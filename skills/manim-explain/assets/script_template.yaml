# Script template: demos/<series>/<slug>/script.yaml. Replace the example, keep the structure.
# Read references/narrative.md first. Lint with: scripts/lint_script.py demos/<series>/<slug>
#
# One central question (Q0, a `question` beat in unit u0) is held open; units chain under it.
# Each unit: question -> work (setup/dig/attempt) -> turn (wall + revelation, attempt +
# refuting revelation, or a plain answer) -> cash-out (consolidate) -> link to the next.
# Exactly one beat is the climax: the revelation or answer that resolves Q0.
#
# Lead with ideas, thought process and intuitive derivation: start from the bedrock premise,
# simplify before generalizing, state the logical constraint before a mathematical move, and
# keep spoken numbers to the few that do logical work (secondary specs stay in SOURCE_NOTES.md).
#
# say:  spoken text only. No LaTeX. Numbers as spoken words or digits.
# show: what the picture does, in words. The storyboard turns it into plan/layout.json and
#       plan/events.yaml after the narration is voiced.
title: Why ice floats
viewer_contract:
  starting_point: Solids are usually denser than their liquids.
  central_question: Why does frozen water float on liquid water?
  bedrock_premise: A water molecule is V-shaped with slightly positive hydrogen tips and a slightly negative oxygen corner, so opposites attract along fixed directions.
  initial_intuition: Cold packs molecules closer, so ice should sink.
  anchor_example: A glass of water with an ice cube, and a few molecules drawn large.
  reasoning_spine: Floating is a density contest -> slower molecules should pack tighter -> yet ice expands by about 9% -> something must hold frozen water molecules apart -> directional attraction locks each molecule to four neighbours at fixed angles -> freezing builds an open cage while liquid molecules break bonds and fill the gaps.
  ending_insight: Hydrogen bonds lock water into an open lattice that takes more room than the liquid.

beats:
  - id: hook
    narrative_role: hook
    unit: u0
    say: Drop a cube of almost any frozen liquid into its own melt, and it sinks. Drop ice into water, and it bobs right back up.
    show: Two glasses side by side; a wax cube sinks in molten wax, an ice cube floats in water.

  - id: q0
    narrative_role: question
    unit: u0
    say: So what is it about water that makes its solid lighter than its liquid?
    show: The floating cube stays; the wax glass dims.

  - id: setup_density
    narrative_role: setup
    unit: u1
    parent: u0
    say: Floating is a density contest. Whatever packs more mass into the same space sinks below whatever packs less.
    show: A unit box fills with molecules; a mass readout counts up beside it.

  - id: attempt_cold
    narrative_role: attempt
    unit: u1
    say: You might expect cold to win that contest. Slower molecules jostle less, so they should settle closer together.
    show: Molecules in the box slow down and drift closer; the readout climbs.

  - id: wall_ice
    narrative_role: wall
    role_sub: contra
    unit: u1
    obstruction: ice is about nine percent less dense than water
    against: attempt_cold
    say: But measure ice and it goes the other way. The same mass takes up about nine percent more room once it freezes.
    show: The box freezes and expands past its outline; the readout drops.

  - id: reveal_lattice
    narrative_role: revelation
    unit: u1
    resolves: wall_ice
    link: causal
    climax: true
    say: The answer is in how water molecules hold hands. Each one hydrogen bonds to four neighbours, and that bond only works at a fixed angle, so frozen water locks into an open hexagonal cage.
    show: One molecule bonds to four neighbours; the pattern repeats into a hexagonal lattice with visible empty space.

  - id: name_bond
    narrative_role: consolidate
    role_sub: name
    unit: u1
    say: That empty space inside the cage is the whole effect. Liquid water keeps breaking and remaking those bonds, so its molecules can fill the gaps.
    show: Liquid molecules slide into the cage's holes; the two boxes' readouts compare.

  - id: payoff
    narrative_role: payoff
    unit: u0
    say: So ice floats because water, uniquely, builds a solid that is mostly empty space, held open by the very bonds that make water water.
    show: Back to the floating cube; the lattice overlays it and fades.
